<svg xmlns="http://www.w3.org/2000/svg" width="800" height="492" viewBox="0 0 800 492">
<rect width="800" height="492" rx="8" fill="#1d2026"/>
<g fill="#3a3f48"><circle cx="20" cy="18" r="5"/><circle cx="38" cy="18" r="5"/><circle cx="56" cy="18" r="5"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text y="52" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >$ ajar</tspan></text>
<text y="71" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" font-weight="bold" >ajar</tspan><tspan x="64.0" fill="#cdd3dc" >v0.1.0</tspan></text>
<text y="90" style="white-space:pre"></text>
<text y="109" style="white-space:pre"><tspan x="47.2" fill="#cdd3dc" font-weight="bold" >CRITICAL </tspan><tspan x="139.6" fill="#cdd3dc" font-weight="bold" >Stable Diffusion WebUI (A1111)</tspan><tspan x="408.4" fill="#7c8592" >exposed, no auth</tspan></text>
<text y="128" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >http://127.0.0.1:7860/sdapi/v1/sd-models</tspan></text>
<text y="147" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >The API can load models and, with common extensions, run scripts on the host. It has</tspan></text>
<text y="166" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >no authentication unless you add --gradio-auth.</tspan></text>
<text y="185" style="white-space:pre"></text>
<text y="204" style="white-space:pre"><tspan x="47.2" fill="#cdd3dc" font-weight="bold" >CRITICAL </tspan><tspan x="139.6" fill="#cdd3dc" font-weight="bold" >ComfyUI</tspan><tspan x="215.2" fill="#7c8592" >exposed, no auth</tspan></text>
<text y="223" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >http://127.0.0.1:8188/system_stats</tspan></text>
<text y="242" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >ComfyUI custom nodes can run arbitrary Python, so an exposed instance is effectively</tspan></text>
<text y="261" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >remote code execution on the host.</tspan></text>
<text y="280" style="white-space:pre"></text>
<text y="299" style="white-space:pre"><tspan x="47.2" fill="#e2615a" font-weight="bold" >HIGH </tspan><tspan x="106.0" fill="#cdd3dc" font-weight="bold" >Ollama</tspan><tspan x="173.2" fill="#7c8592" >exposed, no auth</tspan></text>
<text y="318" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >http://127.0.0.1:11434/api/tags</tspan></text>
<text y="337" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >Anyone who can reach it can pull and run models, use your GPU, and read or delete</tspan></text>
<text y="356" style="white-space:pre"><tspan x="72.4" fill="#7c8592" >your local models. Ollama ships with no authentication.</tspan></text>
<text y="375" style="white-space:pre"></text>
<text y="394" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >1 target(s) scanned</tspan></text>
<text y="413" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" font-weight="bold" >2 critical  1 high</tspan></text>
<text y="432" style="white-space:pre"></text>
<text y="451" style="white-space:pre"><tspan x="22.0" fill="#cdd3dc" >Bind these services to 127.0.0.1, or put them behind authentication.</tspan></text>
</g></svg>
